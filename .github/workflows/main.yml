name: Run App Locally

on:
  push:
    branches: ["main"]

jobs:
  run-app:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Kill old process (if running)
        run: |
          pkill -f "node index.js" || true

      - name: Start server
        run: |
          nohup node index.js > output.log 2>&1 &
